<!DOCTYPE html>
<html>
<head>
    <title>🎯 Direct Attack Test</title>
    <style>
        body { font-family: Arial; background: #1a1a2e; color: white; padding: 20px; }
        .btn { background: #ff4757; color: white; padding: 10px 20px; margin: 10px; border: none; border-radius: 5px; cursor: pointer; }
        .result { background: #000; padding: 10px; margin: 10px 0; border-radius: 5px; font-size: 12px; }
        .success { border-left: 4px solid #2ed573; }
        .error { border-left: 4px solid #ff4757; }
    </style>
</head>
<body>
    <h1>🎯 Direct Attack Test</h1>
    <p>This sends the same attack directly to the backend to verify detection</p>
    
    <button class="btn" onclick="testDirectAttack()">Send SQL Injection Attack</button>
    <button class="btn" onclick="checkAlerts()">Check Backend Alerts</button>
    <button class="btn" onclick="clearResults()">Clear</button>
    
    <div id="results"></div>

    <script>
        function log(msg, type = 'result') {
            const div = document.createElement('div');
            div.className = `result ${type}`;
            div.innerHTML = `[${new Date().toLocaleTimeString()}] ${msg}`;
            document.getElementById('results').appendChild(div);
        }

        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }

        async function testDirectAttack() {
            log('🎯 Sending SQL injection attack directly to backend...', 'result');
            
            const attackData = {
                method: 'GET',
                path: "/login?username=' OR 1=1--&password=test",
                query: "username=' OR 1=1--&password=test",
                user_agent: 'Direct Test Browser',
                ip: '192.168.1.999',
                timestamp: new Date().toISOString()
            };
            
            try {
                const response = await fetch('https://nitedu-anomaly-detection.onrender.com/api/v1/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(attackData)
                });
                
                const result = await response.json();
                
                if (result.is_anomaly) {
                    log(`✅ ATTACK DETECTED! Confidence: ${(result.confidence * 100).toFixed(1)}%`, 'success');
                    log(`🎯 Attack Type: ${result.attack_type}`, 'success');
                    log(`🔍 Method: ${result.method}`, 'result');
                    log(`📍 Event ID: ${result.event_id}`, 'result');
                    
                    if (result.confidence >= 0.8) {
                        log('🚨 HIGH CONFIDENCE - Should trigger dashboard alert!', 'success');
                    }
                } else {
                    log('❌ Attack NOT detected', 'error');
                }
                
                log(`Full response: ${JSON.stringify(result, null, 2)}`, 'result');
                
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            }
        }

        async function checkAlerts() {
            log('📋 Checking backend alerts...', 'result');
            
            try {
                const response = await fetch('https://nitedu-anomaly-detection.onrender.com/api/v1/alerts');
                const alerts = await response.json();
                
                log(`📊 Total alerts in backend: ${alerts.length}`, 'result');
                
                if (alerts.length > 0) {
                    const latest = alerts[alerts.length - 1];
                    log(`🚨 Latest alert: ${latest.attack_type} from ${latest.source_ip}`, 'success');
                    log(`⏰ Time: ${latest.timestamp}`, 'result');
                    log(`🎯 Confidence: ${(latest.confidence * 100).toFixed(1)}%`, 'result');
                }
                
                // Check stats
                const statsResponse = await fetch('https://nitedu-anomaly-detection.onrender.com/api/v1/alerts/stats/summary');
                const stats = await statsResponse.json();
                log(`📈 Stats: ${stats.total_requests} requests, ${stats.attack_requests} attacks`, 'result');
                
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            }
        }

        window.onload = () => {
            log('🚀 Direct attack tester ready', 'result');
            log('1. Click "Send SQL Injection Attack" to test detection', 'result');
            log('2. Click "Check Backend Alerts" to verify it was stored', 'result');
            log('3. Check your dashboard - it should update within 3-5 seconds', 'result');
        };
    </script>
</body>
</html>
