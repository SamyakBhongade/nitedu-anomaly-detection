<!DOCTYPE html>
<html>
<head>
    <title>Complete Integration Test</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #1a1a2e; color: white; }
        button { padding: 10px 20px; margin: 10px; background: #00d4ff; border: none; color: white; cursor: pointer; }
        .result { margin: 10px 0; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 5px; }
        .success { background: rgba(46,213,115,0.2); }
        .error { background: rgba(255,71,87,0.2); }
        .warning { background: rgba(255,165,0,0.2); }
    </style>
</head>
<body>
    <h1>🔗 Complete Integration Test</h1>
    <p>Tests: Cloudflare Worker → Database → Dashboard</p>
    
    <button onclick="testCloudflareWorker()">1. Test Cloudflare Worker</button>
    <button onclick="testCloudflareAttack()">2. Test Attack via Cloudflare</button>
    <button onclick="testDatabaseData()">3. Check Database Data</button>
    <button onclick="testDashboardData()">4. Test Dashboard APIs</button>
    <button onclick="openDashboard()">5. Open Live Dashboard</button>
    
    <div id="results"></div>

    <script>
        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `result ${type}`;
            div.innerHTML = `${new Date().toLocaleTimeString()}: ${message}`;
            document.getElementById('results').appendChild(div);
        }

        async function testCloudflareWorker() {
            try {
                const response = await fetch('https://nitedu-protection.samyakjain.workers.dev/?test=integration');
                const text = await response.text();
                
                if (text.includes('database')) {
                    log(`✅ Cloudflare Worker: ${response.status} - Database logging enabled`, 'success');
                } else {
                    log(`⚠️ Cloudflare Worker: ${response.status} - May not be logging to database`, 'warning');
                }
                log(`Response: ${text.substring(0, 100)}...`, 'info');
            } catch (error) {
                log(`❌ Cloudflare Worker Failed: ${error.message}`, 'error');
            }
        }

        async function testCloudflareAttack() {
            try {
                const response = await fetch("https://nitedu-protection.samyakjain.workers.dev/login?id=1' OR '1'='1");
                const text = await response.text();
                
                if (response.status === 403) {
                    log(`✅ Attack Blocked by Cloudflare: ${response.status}`, 'success');
                } else {
                    log(`⚠️ Attack Response: ${response.status} - ${text.substring(0, 50)}`, 'warning');
                }
                
                // Wait for database logging
                setTimeout(() => {
                    log('⏳ Waiting 3 seconds for database logging...', 'info');
                }, 1000);
                
            } catch (error) {
                log(`❌ Cloudflare Attack Test Failed: ${error.message}`, 'error');
            }
        }

        async function testDatabaseData() {
            try {
                // Test alerts
                const alertsResponse = await fetch('https://nitedu-anomaly-detection.onrender.com/api/v1/alerts');
                const alerts = await alertsResponse.json();
                
                // Test stats
                const statsResponse = await fetch('https://nitedu-anomaly-detection.onrender.com/api/v1/alerts/stats/summary');
                const stats = await statsResponse.json();
                
                log(`✅ Database Data: ${alerts.length} alerts, ${stats.total_requests} requests, ${stats.attack_requests} attacks`, 'success');
                
                if (alerts.length > 0) {
                    const latest = alerts[0];
                    log(`Latest Alert: ${latest.attack_type} from ${latest.source_ip} via ${latest.method}`, 'info');
                }
                
            } catch (error) {
                log(`❌ Database Data Failed: ${error.message}`, 'error');
            }
        }

        async function testDashboardData() {
            try {
                const response = await fetch('https://nitedu-anomaly-detection.onrender.com/api/v1/status');
                const status = await response.json();
                
                log(`✅ Dashboard APIs: ${status.system_status} | DB Alerts: ${status.total_alerts_in_database} | WebSocket: ${status.websocket_connections}`, 'success');
                
            } catch (error) {
                log(`❌ Dashboard APIs Failed: ${error.message}`, 'error');
            }
        }

        function openDashboard() {
            window.open('dashboard/live_dashboard.html', '_blank');
            log('🖥️ Dashboard opened - should show real Cloudflare + Database data!', 'success');
        }

        async function runFullTest() {
            log('🚀 Starting Complete Integration Test...', 'info');
            
            await testCloudflareWorker();
            await new Promise(resolve => setTimeout(resolve, 2000));
            
            await testCloudflareAttack();
            await new Promise(resolve => setTimeout(resolve, 4000));
            
            await testDatabaseData();
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            await testDashboardData();
            
            log('✅ Complete Integration Test Finished!', 'success');
        }

        window.onload = () => {
            log('🔗 Complete Integration Test Ready', 'info');
            log('Tests: Cloudflare Worker → Render Database → Dashboard', 'info');
            
            // Auto-run full test after 2 seconds
            setTimeout(runFullTest, 2000);
        };
    </script>
</body>
</html>
