name = "nitedu-anomaly-detection"
main = "worker.js"
compatibility_date = "2024-01-01"

[env.production.vars]
ANOMALY_API_URL = "https://your-backend.railway.app"

[[env.production.routes]]
pattern = "nitedu.in/*"
