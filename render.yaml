services:
  - type: web
    name: nitedu-anomaly-detection
    env: python
    buildCommand: "pip install fastapi uvicorn sqlalchemy redis numpy websockets python-multipart python-dotenv"
    startCommand: "cd backend && python -m uvicorn app.main_simple:app --host 0.0.0.0 --port $PORT"
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: sqlite:///tmp/cyberdefense.db